name: CPU Tests And Source Audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      USE_TF: "0"
      USE_FLAX: "0"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c constraints/training.txt -e '.[training,test,pretrained]'
      - run: python -m pytest -q
      - run: python scripts/check_docs.py
      - run: python scripts/build_release.py --output dist/source
